<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152a48"><title>おでかけナビ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18283e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:540px;margin:auto;padding:24px 16px 70px}h1{font-size:27px;margin:0 0 4px}h2{font-size:18px;margin:0 0 15px}.muted{color:#68788c;font-size:13px;line-height:1.6}.panel{background:white;border-radius:20px;padding:19px;margin:15px 0;box-shadow:0 4px 22px #1a31500b}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{display:block;width:100%;padding:13px;border:1px solid #d3ddea;border-radius:11px;font-size:16px;color:#17253b;background:white}button,a.btn{cursor:pointer;border:0;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;display:inline-block}.primary{background:#1766d2;color:white}.secondary{background:#eaf1fc;color:#1954a1}.danger{background:#fff0f0;color:#a42b2b}.full{display:block;width:100%;margin-top:11px}.row{display:flex;gap:9px;align-items:center}.row>input{flex:1;min-width:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{background:#edf1f7;color:#536177}.tabs button.active{background:#1766d2;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.status{min-height:21px;margin-top:12px;font-size:13px;color:#1954a1;line-height:1.5}.result{background:#172b49;border-radius:16px;padding:19px;color:white}.result strong{display:block;font-size:29px;margin:7px 0}.result small{color:#c1cee0;line-height:1.7}.saved{border-top:1px solid #edf1f6;padding:12px 0}.saved:first-child{border-top:0}.saved-title{font-weight:700}.saved-meta{font-size:12px;color:#65758b;margin:5px 0 9px}.saved .row{flex-wrap:wrap}.saved button{padding:9px 12px}.hint{background:#f1f5fa;border-radius:12px;padding:12px;font-size:13px;color:#5a6a80}.subhead{font-size:12px;font-weight:700;color:#65758b;margin-top:14px}
</style></head><body><main class="wrap"><h1>おでかけナビ 🚉</h1><p class="muted">徒歩と電車の時間を登録して、出発時刻をすぐ計算</p>
<section class="panel"><h2>出発プラン</h2><div class="tabs"><button id="now" class="active">今から出発</button><button id="arr">到着時刻から逆算</button></div>
<label for="home">自宅（メモ用・任意）</label><input id="home" placeholder="例：自宅"><button id="saveHome" class="secondary full">自宅の設定を保存</button>
<label for="station">乗車駅</label><input id="station" placeholder="例：谷保駅">
<label for="dest">降車駅・目的地</label><input id="dest" placeholder="例：新宿駅">
<div class="grid"><div><label for="walk">自宅→乗車駅（徒歩・分）</label><input id="walk" type="number" min="0" max="600" inputmode="numeric" value="10"></div><div><label for="train">駅→駅（電車・分）</label><input id="train" type="number" min="0" max="1440" inputmode="numeric" value="45"></div></div>
<label for="buffer">余裕時間（分）</label><input id="buffer" type="number" min="0" max="180" inputmode="numeric" value="5">
<div id="arrivalWrap" class="hidden"><label for="arrival">到着したい日時</label><input id="arrival" type="datetime-local"></div>
<button id="calc" class="primary full">出発時間を計算</button><button id="saveRoute" class="secondary full">この駅・時間を保存</button><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section id="resultPanel" class="panel hidden"><h2>計算結果</h2><div class="result"><small id="resultTitle"></small><strong id="resultTime"></strong><small id="resultDetail"></small></div></section>
<section class="panel"><h2>乗換案内を確認</h2><p class="muted">NAVITIMEで実際の列車時刻を確認できます。駅名・日時はNAVITIME側で指定してください。</p><a class="btn primary full" href="https://www.navitime.co.jp/transfer/" target="_blank" rel="noopener noreferrer">NAVITIMEの乗換案内を開く ↗</a><button class="secondary full" id="google">入力した駅間をGoogleマップで開く ↗</button></section>
<section class="panel"><h2>保存した経路</h2><div id="routes" class="muted">まだ保存されていません。</div><p class="muted">経路を選ぶと駅名と徒歩・電車時間が復元されます。データはこの端末に保存します。</p></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='odekakenavi-v2',oldKey='odekakenavi-v1';let data={home:'',station:'',dest:'',walk:10,train:45,buffer:5,routes:[]},mode='now';let storageOK=true;
try{const v=JSON.parse(localStorage.getItem(key));if(v&&typeof v==='object')data={...data,...v};else{const old=JSON.parse(localStorage.getItem(oldKey));if(old&&typeof old==='object'){data.home=old.home||'';data.station=old.station||'';data.train=Number(old.minutes)||45;data.buffer=Number(old.buffer)||5;if(Array.isArray(old.favorites))data.routes=old.favorites.filter(x=>typeof x==='string').map(dest=>({station:data.station,dest,walk:10,train:data.train,buffer:data.buffer}))}}}catch(e){storageOK=false}
if(!Array.isArray(data.routes))data.routes=[];
const notice=t=>{$('status').textContent=t};
function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){storageOK=false;notice('保存に失敗しました。Safariのプライベートブラウズやストレージ設定を確認してください。');return false}}
function num(id,max){const raw=$(id).value.trim();const n=Number(raw);return raw!==''&&Number.isFinite(n)&&Number.isInteger(n)&&n>=0&&n<=max?n:null}
function read(){const station=$('station').value.trim(),dest=$('dest').value.trim(),walk=num('walk',600),train=num('train',1440),buffer=num('buffer',180);if(!station||!dest){notice('乗車駅と降車駅を入力してください。');return null}if(walk===null||train===null||buffer===null){notice('徒歩・電車・余裕時間を正しい整数で入力してください。');return null}return {station,dest,walk,train,buffer}}
function fill(r){['station','dest','walk','train','buffer'].forEach(k=>{if(r[k]!==undefined)$(k).value=r[k]});$('resultPanel').classList.add('hidden')}
function fmt(d){return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function local(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}
function setMode(m){mode=m;$('now').classList.toggle('active',m==='now');$('arr').classList.toggle('active',m==='arr');$('arrivalWrap').classList.toggle('hidden',m!=='arr');$('resultPanel').classList.add('hidden')}
function render(){const list=$('routes');list.replaceChildren();if(!data.routes.length){list.textContent='まだ保存されていません。';return}data.routes.forEach((r,i)=>{const el=document.createElement('div');el.className='saved';const title=document.createElement('div');title.className='saved-title';title.textContent=(r.station||'乗車駅未設定')+' → '+r.dest;const meta=document.createElement('div');meta.className='saved-meta';meta.textContent='徒歩 '+r.walk+'分 / 電車 '+r.train+'分 / 余裕 '+r.buffer+'分';const actions=document.createElement('div');actions.className='row';const use=document.createElement('button');use.className='secondary';use.textContent='この経路を使う';use.onclick=()=>{fill(r);notice('保存した経路を読み込みました。');window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm('この経路を削除しますか？')){data.routes.splice(i,1);if(save()){render();notice('経路を削除しました。')}}};actions.append(use,del);el.append(title,meta,actions);list.append(el)})}
$('home').value=data.home;$('station').value=data.station;$('dest').value=data.dest;$('walk').value=data.walk;$('train').value=data.train;$('buffer').value=data.buffer;$('arrival').value=local(new Date(Date.now()+90*60000));
$('now').onclick=()=>setMode('now');$('arr').onclick=()=>setMode('arr');
$('saveHome').onclick=()=>{data.home=$('home').value.trim();if(save())notice('自宅の設定を保存しました。')};
$('saveRoute').onclick=()=>{const r=read();if(!r)return;const old=data.routes.findIndex(x=>x.station===r.station&&x.dest===r.dest);if(old>=0)data.routes.splice(old,1);data.routes.unshift(r);data.station=r.station;data.dest=r.dest;data.walk=r.walk;data.train=r.train;data.buffer=r.buffer;if(save()){render();notice('「'+r.station+' → '+r.dest+'」を保存しました。下の保存した経路に表示されています。')}};
$('calc').onclick=()=>{const r=read();if(!r)return;const total=r.walk+r.train+r.buffer;let base,display;if(mode==='arr'){base=new Date($('arrival').value);if(!Number.isFinite(base.getTime())){notice('到着日時を指定してください。');return}display=new Date(base.getTime()-total*60000);$('resultTitle').textContent='家を出る目安';$('resultDetail').textContent='到着希望 '+fmt(base)+' / 徒歩 '+r.walk+'分 + 電車 '+r.train+'分 + 余裕 '+r.buffer+'分'}else{base=new Date();display=new Date(base.getTime()+total*60000);$('resultTitle').textContent='今出発した場合の到着目安';$('resultDetail').textContent='出発 '+fmt(base)+' / 徒歩 '+r.walk+'分 + 電車 '+r.train+'分 + 余裕 '+r.buffer+'分'}$('resultTime').textContent=fmt(display);$('resultPanel').classList.remove('hidden');notice('計算しました。電車の実際の時刻はNAVITIMEで確認してください。')};
$('google').onclick=()=>{const r=read();if(!r)return;window.open('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(r.station)+'&destination='+encodeURIComponent(r.dest)+'&travelmode=transit','_blank','noopener,noreferrer')};
render();if(!storageOK)notice('端末への保存を利用できない可能性があります。ブラウザ設定をご確認ください。');
})();
</script></body></html>
